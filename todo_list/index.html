<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <link rel="stylesheet" href="css/todo_list.css">
</head>
<body>

<div class="container">

    <h1>✨Todo List✨</h1>

    <div class="input-box">
        <input
            type="text"
            id="todoInput"
            placeholder="Enter a task">

        <button id="addBtn">
            Add
        </button>
    </div>

    <ul id="todoList"></ul>

    <button id="downloadBtn">Download Todo List</button>

</div>

<script src="js/todo_list.js"></script>

</body>
</html>
